name: Deploy All Projects to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'navigation-ab-test/**'
      - 'origin-cards-ab-test/**'
      - '.github/workflows/deploy-navigation-ab-test.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Navigation AB Test
        working-directory: ./navigation-ab-test
        run: |
          npm ci
          NODE_ENV=production npm run build

      - name: Install and Build Origin Cards AB Test
        working-directory: ./origin-cards-ab-test
        run: |
          npm ci
          NODE_ENV=production npm run build

      - name: Prepare deployment structure
        run: |
          mkdir -p _site/navigation-ab-test
          mkdir -p _site/origin-cards-ab-test
          cp -r navigation-ab-test/dist/* _site/navigation-ab-test/
          cp -r origin-cards-ab-test/dist/* _site/origin-cards-ab-test/

      - name: Create root 404 handler
        run: |
          cat > _site/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <script type="text/javascript">
                // Root-level 404 handler for multi-project GitHub Pages
                // Detects which project the 404 is for and redirects appropriately
                var path = window.location.pathname;

                // Check if path starts with /FSDmodugno-testing/navigation-ab-test/
                if (path.indexOf('/FSDmodugno-testing/navigation-ab-test/') === 0) {
                  // Extract the route after /navigation-ab-test/
                  var route = path.replace('/FSDmodugno-testing/navigation-ab-test/', '');
                  // Redirect to navigation-ab-test index with encoded route
                  var redirect = '/FSDmodugno-testing/navigation-ab-test/?/' + route.replace(/&/g, '~and~');
                  if (window.location.search) {
                    redirect += '&' + window.location.search.slice(1).replace(/&/g, '~and~');
                  }
                  window.location.replace(redirect + window.location.hash);
                }
                // Check if path starts with /FSDmodugno-testing/origin-cards-ab-test/
                else if (path.indexOf('/FSDmodugno-testing/origin-cards-ab-test/') === 0) {
                  var route = path.replace('/FSDmodugno-testing/origin-cards-ab-test/', '');
                  var redirect = '/FSDmodugno-testing/origin-cards-ab-test/?/' + route.replace(/&/g, '~and~');
                  if (window.location.search) {
                    redirect += '&' + window.location.search.slice(1).replace(/&/g, '~and~');
                  }
                  window.location.replace(redirect + window.location.hash);
                }
                // Default: redirect to root
                else {
                  window.location.replace('/FSDmodugno-testing/');
                }
              </script>
            </head>
            <body>
              <p>Redirecting...</p>
            </body>
          </html>
          EOF

      - name: Create root index
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>UX Hackathon Projects</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
              }
              .container {
                background: white;
                border-radius: 16px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                max-width: 600px;
                width: 100%;
                padding: 40px;
              }
              h1 {
                color: #1a202c;
                font-size: 32px;
                margin-bottom: 12px;
                font-weight: 700;
              }
              .subtitle {
                color: #718096;
                font-size: 16px;
                margin-bottom: 32px;
              }
              .projects {
                list-style: none;
              }
              .project-item {
                margin-bottom: 16px;
              }
              .project-link {
                display: block;
                padding: 20px;
                background: #f7fafc;
                border: 2px solid #e2e8f0;
                border-radius: 12px;
                text-decoration: none;
                color: #2d3748;
                font-size: 18px;
                font-weight: 500;
                transition: all 0.2s ease;
                position: relative;
                overflow: hidden;
              }
              .project-link:hover {
                background: #edf2f7;
                border-color: #667eea;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
              }
              .project-link::after {
                content: '→';
                position: absolute;
                right: 20px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 24px;
                color: #667eea;
                opacity: 0;
                transition: all 0.2s ease;
              }
              .project-link:hover::after {
                opacity: 1;
                right: 24px;
              }
              .badge {
                display: inline-block;
                background: #667eea;
                color: white;
                font-size: 11px;
                font-weight: 600;
                padding: 4px 8px;
                border-radius: 4px;
                margin-left: 8px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🎨 UX Hackathon Projects</h1>
              <p class="subtitle">Select a project to view</p>
              <ul class="projects">
                <li class="project-item">
                  <a href="/FSDmodugno-testing/origin-cards-ab-test/" class="project-link">
                    Origin Cards AB Test
                  </a>
                </li>
                <li class="project-item">
                  <div class="project-link" style="cursor: default; opacity: 0.6;">
                    Navigation AB Test
                    <span class="badge">Protected</span>
                  </div>
                  <p style="font-size: 13px; color: #718096; margin-top: 8px; padding-left: 4px;">
                    Access by invitation only
                  </p>
                </li>
              </ul>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
